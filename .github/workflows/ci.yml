# =============================================================================
# CI: the three code gates, then the agent gate, then the image.
#
# Ordering is deliberate — fastest and most isolated first, so a typo fails in
# thirty seconds rather than after a ten-minute agent run:
#
#   lint  →  types  →  unit + integration tests  →  agent evaluation  →  image
#
# **No job sets an LLM or LangSmith credential, and one job asserts that.** That
# assertion is the proof that the offline guarantee is real: a project that
# *claims* to work without a key but whose CI quietly needs one is caught here.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # The evaluation job's database. Credentials here are throwaway service
  # credentials for an ephemeral container, not secrets.
  DATABASE_URL: postgresql://incidents:incidents@localhost:5432/ai_incidents

jobs:
  # ---------------------------------------------------------------------------
  # Fast, no database.
  # ---------------------------------------------------------------------------
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: ruff
        run: uv run ruff check app tests
      - name: mypy
        run: uv run mypy app

  # ---------------------------------------------------------------------------
  # Unit + integration tests.
  # ---------------------------------------------------------------------------
  test:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: incidents
          POSTGRES_PASSWORD: incidents
          POSTGRES_DB: ai_incidents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: pytest
        run: uv run pytest -q

  # ---------------------------------------------------------------------------
  # The agent gate. This is the job that makes the project an AI engineering
  # project rather than a script with tests.
  # ---------------------------------------------------------------------------
  evaluate:
    name: agent evaluation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: incidents
          POSTGRES_PASSWORD: incidents
          POSTGRES_DB: ai_incidents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen

      - name: Assert this job has no credentials
        run: |
          set -euo pipefail
          leaked=0
          for name in ANTHROPIC_API_KEY OPENAI_API_KEY DEEPSEEK_API_KEY \
                      LANGSMITH_API_KEY LANGSMITH_TRACING LANGCHAIN_API_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "::error::$name is set — this job must prove the system works offline"
              leaked=1
            fi
          done
          [ "$leaked" -eq 0 ]
          echo "no credentials present: the offline guarantee is being tested for real"

      - name: Seed the simulated estate
        run: uv run adp-agent seed

      - name: Run the agent evaluation suite
        run: |
          uv run python -m app.evaluation \
            --min-accuracy 1.0 \
            --report eval-report.json

      - name: Upload the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Container image. Built only once the agent behaves.
  # ---------------------------------------------------------------------------
  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: [quality, test, evaluate]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ai-incident-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — the image serves /health
        run: |
          set -euo pipefail
          docker run -d --name smoke --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DB_AUTO_MIGRATE=true \
            ai-incident-agent:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then
              echo "healthy after ${attempt} attempt(s)"; break
            fi
            sleep 2
          done

          cat /tmp/health.json
          python - <<'PY'
          import json, sys
          body = json.load(open("/tmp/health.json"))
          assert body["status"] == "ok", body
          # The image must report honestly that it is running the offline analyst.
          assert body["capabilities"]["llm"]["enabled"] is False, body["capabilities"]
          # /health must be more than liveness: it has to report real state.
          assert body["database"]["reachable"] is True, body
          assert "counts" in body["database"], body
          print("smoke test passed: capabilities and database state both reported")
          PY

      - name: Container logs
        if: always()
        run: docker logs smoke || true
      - name: Stop the container
        if: always()
        run: docker rm -f smoke || true

  # ---------------------------------------------------------------------------
  # Build the warehouse tables the tools read. Without this the CI database has
  # no `warehouse` schema — but `adp-agent seed` above already covers it, so
  # this job exists to catch the case where someone removes that step.
  # ---------------------------------------------------------------------------
  fresh-clone:
    name: fresh clone quickstart
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: incidents
          POSTGRES_PASSWORD: incidents
          POSTGRES_DB: ai_incidents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U incidents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run the README quickstart verbatim
        run: |
          set -euo pipefail
          cp .env.example .env
          uv sync --extra dev --frozen
          uv run adp-agent seed
          uv run pytest -q
          uv run python -m app.evaluation --min-accuracy 1.0
          echo "quickstart works on a fresh clone with no credentials"
