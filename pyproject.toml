[project]
name = "ai-incident-agent"
version = "0.1.0"
description = "An agentic AI system that investigates failed data pipelines: triage, log and SQL investigation, root-cause analysis, human-approved remediation, and incident reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # --- agent orchestration ------------------------------------------------
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.0",
    # --- provider-agnostic LLM access --------------------------------------
    "litellm>=1.55.0",
    # --- tracing + evaluation ----------------------------------------------
    "langsmith>=0.1.140",
    # --- persistence --------------------------------------------------------
    "psycopg[binary,pool]>=3.2.3",
    # --- SQL parsing, for a real read-only boundary -------------------------
    # A prefix check on "select" is bypassable (`select 1; drop table x` passes
    # it). Parsing the statement is what turns the guard into a boundary.
    "sqlglot>=25.0.0",
    # --- serving ------------------------------------------------------------
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.2",
    # Tool-argument validation. Imported directly by app/tools/registry.py, so
    # it is declared directly rather than inherited from a transitive dep.
    "jsonschema>=4.23.0",
    # The evaluation suite is data, not code, so the tasks can be reviewed in a PR.
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
]

[project.scripts]
adp-agent = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a real PostgreSQL database (skipped when unavailable)",
    "llm: needs a real LLM API key (skipped when unavailable)",
    "langsmith: needs a LangSmith API key (skipped when unavailable)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # long lines in prompt strings are deliberate
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
